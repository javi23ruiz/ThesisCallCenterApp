<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Insurance Assistant</title>
    <link rel="stylesheet" href="css/styles.css" />
  </head>
  <body>
    <div class="app">
      <header class="topbar">
        <div class="brand">
          <div class="brand-dot"></div>
          <span class="brand-title">Master Thesis - UCM - From Voice to Insight: An LLM-Based System for Real-Time Question Answering in Insurance Call Centers</span>
        </div>
      </header>

      <main class="content">
        <section class="chat">
          <h2 class="section-title">Conversation</h2>
          <div id="messages" class="messages"></div>
          <form id="chat-form" class="composer">
            <button type="button" class="btn btn-settings" title="Settings">⚙️</button>
            <input id="question" type="text" placeholder="Ask a question..." autocomplete="off" />
            <button type="submit" class="btn btn-send">Send</button>
            <button type="button" class="btn btn-call" title="Call">📞</button>
          </form>
        </section>

        <aside class="sidebar" id="rag-container">
          <h2 class="section-title">Retrieved Content</h2>
          <div id="rag-list" class="rag-list"></div>
        </aside>
      </main>
    </div>

    <!-- RAG progress popup -->
    <div id="rag-popup" class="popup" aria-hidden="true">
      <div class="popup-box">
        <div class="spinner" aria-hidden="true"></div>
        <div class="popup-text">RAG pipeline: search in progress…</div>
      </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <script src="js/app.js"></script>
  </body>
  </html>
